<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title>
<style>:root{color-scheme:dark;--bg:#070a18;--card:#0e1330;--line:#232a5a;--mute:#9aa3c7;--blue:#2e8bff;--pur:#9b5cff}*{box-sizing:border-box}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(700px 400px at 90% -10%,rgba(155,92,255,.18),transparent 60%),var(--bg);color:#f4f6ff}
.wrap{max-width:820px;margin:auto;padding:0 16px}
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}.authc{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--pur));display:grid;place-items:center;font-weight:800;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 18px}
.top{position:sticky;top:0;z-index:5;background:rgba(7,10,24,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0 8px}.bar h1{font-size:17px;margin:0;flex:1;min-width:140px}#dirty{color:#ffb454;font-size:12px;font-weight:600;margin-left:6px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px}.pills a{white-space:nowrap;padding:7px 15px;border:1px solid var(--line);border-radius:999px;color:var(--mute);text-decoration:none;font-size:13px;background:var(--card)}.pills a:hover{color:#fff;border-color:var(--blue)}
h2{font-size:18px;margin:34px 0 12px;scroll-margin-top:130px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 5px}label:first-child{margin-top:0}
input,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid #2a3270;background:#070a18;color:#f4f6ff;font:inherit;transition:border-color .2s}input:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,139,255,.2)}
input[type=file]{padding:9px;font-size:13px}
button,.btn{display:inline-block;padding:10px 18px;border-radius:999px;border:0;background:linear-gradient(135deg,var(--blue),var(--pur));color:#fff;font:600 14px system-ui,sans-serif;cursor:pointer;margin:6px 6px 4px 0;text-decoration:none}
button.g,.btn.g{background:#161c47;border:1px solid #2a3270}button.d{background:#5c1b30}.bar button,.bar .btn{margin:0}
#msg{position:fixed;left:16px;right:16px;bottom:16px;max-width:520px;margin:auto;background:var(--card);border:1px solid var(--blue);border-radius:14px;padding:13px 16px;display:none;z-index:9;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.th{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:6px}.th div{width:112px}.th img{width:112px;height:112px;object-fit:cover;border-radius:12px;display:block;border:1px solid var(--line)}.th button{width:100%;margin:6px 0 0}
</style></head><body>
<div class="auth" id="login"><div class="authc"><div class="logo">RS</div><h1>Admin login</h1><p class="sub">Sign in to edit your website.</p><label>Email</label><input id="em" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"><label>Password</label><input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"><label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-top:10px"><input type="checkbox" id="sp" style="width:auto"> Show password</label><button id="go" style="width:100%;margin-top:18px">Log in</button><p id="diag" class="sub" style="font-size:12px;margin:14px 0 0">Checking connection...</p></div></div>
<div id="app" hidden><div class="top"><div class="wrap"><div class="bar"><h1>Edit website<span id="dirty" hidden>&bull; unsaved</span></h1><a class="btn g" href="/" target="_blank" rel="noopener">View site</a><button id="save">Save</button><button class="g" id="out">Log out</button></div><div class="pills"><a href="#s-basic">Basic</a><a href="#s-skills">Skills</a><a href="#s-projects">Projects</a><a href="#s-edu">Education</a><a href="#s-contact">Contact</a><a href="#s-gallery">Gallery</a></div></div></div><div class="wrap" id="form"></div><div class="wrap"><button id="save2">Save changes</button></div><div style="height:90px"></div></div>

var DEF={location:'Sherpur, Bangladesh 🇧🇩',role:'Student, aspiring web developer, and AI & technology enthusiast.',role_bn:'শিক্ষার্থী, ভবিষ্যৎ ওয়েব ডেভেলপার এবং এআই ও প্রযুক্তি অনুরাগী।',

{t:'Self-learning',d:'Web development, AI tools, and technology',t_bn:'নিজে নিজে শেখা',d_bn:'ওয়েব ডেভেলপমেন্ট, এআই টুল ও প্রযুক্তি'},
{t:'Practical experience',d:'Website projects and an e-commerce business',t_bn:'ব্যবহারিক অভিজ্ঞতা',d_bn:'ওয়েবসাইট প্রজেক্ট ও একটি ই-কমার্স ব্যবসা'}],

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function msg(t,e){var m=$('#msg');m.textContent=t;m.style.display='block';m.style.borderColor=e?'#ff5c7a':'#2e8bff';clearTimeout(msg.t);msg.t=setTimeout(function(){m.style.display='none'},4500)}
function get(p){return p.split('.').reduce(function(o,k){return o&&o[k]},D)}
function set(p,v){var a=p.split('.'),o=D;for(var i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}
function F(p,l,t){var v=get(p);v=v==null?'':v;var a=' data-p="'+p+'"';return '<label>'+l+'</label>'+(t?'<textarea rows="4"'+a+'>'+esc(v)+'</textarea>':'<input'+a+' value="'+esc(v)+'">')}
function draw(){var h='<h2 id="s-basic">Basic</h2><div class="box">'+F('location','Location')+F('role','Role (English)')+F('role_bn','Role (Bangla)')+F('intro','Intro (English)',1)+F('intro_bn','Intro (Bangla)',1)+'</div>';
h+='<h2 id="s-skills">Skills</h2><div class="box">'+F('skills_txt','Skills, separated by commas',1)+'</div><h2 id="s-projects">Projects</h2>';
D.projects.forEach(function(p,i){var k='projects.'+i+'.';h+='<div class="box">'+F(k+'title','Title')+F(k+'desc','Description (English)',1)+F(k+'desc_bn','Description (Bangla)',1)+F(k+'link','Website link')+F(k+'image','Screenshot URL')+'<label>Upload screenshot</label><input type="file" accept="image/*" data-up="'+k+'image"><button class="d" data-del="projects.'+i+'">Delete project</button></div>'});
h+='<button class="g" data-add="projects">+ Add project</button><h2 id="s-edu">Education and experience</h2>';
D.education.forEach(function(p,i){var k='education.'+i+'.';h+='<div class="box">'+F(k+'t','Title (English)')+F(k+'d','Details (English)',1)+F(k+'t_bn','Title (Bangla)')+F(k+'d_bn','Details (Bangla)',1)+'<button class="d" data-del="education.'+i+'">Delete</button></div>'});
h+='<button class="g" data-add="education">+ Add item</button><h2 id="s-contact">Contact links</h2><div class="box">'+F('contact.email','Email')+F('contact.instagram','Instagram username')+F('contact.facebook','Facebook link')+F('contact.github','GitHub link')+F('contact.whatsapp','WhatsApp number with country code, e.g. 8801XXXXXXXXX')+'</div>';
h+='<h2 id="s-gallery">Photo gallery</h2><div class="box"><div class="th">'+D.gallery.map(function(u,i){return '<div><img src="'+esc(u)+'" alt=""><button class="d" data-delg="'+i+'">Delete</button></div>'}).join('')+'</div><label>Add photos</label><input type="file" accept="image/*" multiple data-upg="1"></div>';
$('#form').innerHTML=h}
function shrink(f){return new Promise(function(res){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){res(b||f)},'image/jpeg',.82)};im.onerror=function(){res(f)};im.src=u})}
function up(f){return shrink(f).then(function(b){var n='uploads/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';return sb.storage.from('site').upload(n,b,{contentType:'image/jpeg',cacheControl:'31536000'}).then(function(r){if(r.error)throw r.error;return sb.storage.from('site').getPublicUrl(n).data.publicUrl})})}
function rm(u){var p=(u||'').split('/object/public/site/')[1];if(p)sb.storage.from('site').remove([p])}
var f=$('#form');
f.addEventListener('input',function(e){if(e.target.dataset.p)set(e.target.dataset.p,e.target.value)});
f.addEventListener('change',function(e){var t=e.target,fs=t.files;if(!fs||!fs.length)return;msg('Uploading...');
if(t.dataset.up){up(fs[0]).then(function(u){set(t.dataset.up,u);draw();msg('Uploaded. Press Save changes.')}).catch(function(x){msg(x.message,1)})}
else if(t.dataset.upg){Promise.all([].map.call(fs,up)).then(function(us){D.gallery=D.gallery.concat(us);draw();msg('Uploaded. Press Save changes.')}).catch(function(x){msg(x.message,1)})}});
f.addEventListener('click',function(e){var t=e.target.dataset;if(t.add){D[t.add].push(t.add==='projects'?{title:'',desc:'',desc_bn:'',link:'',image:''}:{t:'',d:'',t_bn:'',d_bn:''});draw()}
else if(t.del){var a=t.del.split('.');if(confirm('Delete this?')){D[a[0]].splice(+a[1],1);draw()}}
else if(t.delg){if(confirm('Delete this photo?')){rm(D.gallery[+t.delg]);D.gallery.splice(+t.delg,1);draw();msg('Removed. Press Save changes.')}}});
function save(){D.skills=(D.skills_txt||'').split(',').map(function(s){return s.trim()}).filter(Boolean);var o=Object.assign({},D);delete o.skills_txt;
sb.from('site_content').update({data:o,updated_at:new Date().toISOString()}).eq('id',1).select().then(function(r){if(r.error)msg(r.error.message,1);else if(!r.data||!r.data.length)msg('Not saved. Log in again.',1);else{$('#dirty').hidden=true;msg('Saved! Your website is updated.')}})}
$('#save').onclick=$('#save2').onclick=save;
function start(){$('#login').hidden=true;$('#app').hidden=false;sb.from('site_content').select('data').eq('id',1).single().then(function(r){var d=(r.data&&r.data.data)||{};D=Object.assign({},DEF,d);D.contact=Object.assign({},DEF.contact,d.contact);D.skills_txt=(D.skills||[]).join(', ');draw()})}
$('#go').onclick=function(){sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value}).then(function(r){if(r.error)msg(r.error.message+' | status '+r.error.status+' | code '+(r.error.code||'-')+' | email: '+$('#em').value.trim(),1);else start()})};
$('#out').onclick=function(){sb.auth.signOut().then(function(){location.reload()})};
sb.auth.getSession().then(function(r){if(r.data&&r.data.session)start()});
var dirty=function(){$('#dirty').hidden=false};f.addEventListener('input',dirty);f.addEventListener('change',dirty);window.addEventListener('beforeunload',function(e){if(!$('#dirty').hidden){e.preventDefault();e.returnValue=''}});
$('#sp').onchange=function(){$('#pw').type=this.checked?'text':'password'};$('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('#go').click()});
fetch(U+'/auth/v1/settings',{headers:{apikey:K}}).then(function(r){return r.json()}).then(function(s){$('#diag').textContent='Build 5 | project '+U.replace('https://','').split('.')[0]+' | email login: '+(s.external&&s.external.email?'ON':'OFF')+' | sign-ups: '+(s.disable_signup?'closed':'open')}).catch(function(e){$('#diag').textContent='Build 5 | cannot reach Supabase: '+e.message});
</script></body></html>
